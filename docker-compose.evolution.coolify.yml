# Evolution API v2 no Coolify (servidor de produção/homologação).
# Para desenvolvimento local continue usando docker-compose.evolution.yml.
#
# Uso: no Coolify, crie um recurso "Docker Compose" apontando para este arquivo
# (um recurso para produção e outro para homologação). Em seguida:
#   - Domínio do serviço evolution-api: https://wa.sistemadental.com.br:8080
#     (homologação: https://wa-homolog.sistemadental.com.br:8080). O ":8080" diz ao
#     proxy do Coolify qual porta do container recebe as requisições; o acesso público
#     continua em https (443).
#   - Preencha as variáveis abaixo na aba "Environment Variables".
#     EVOLUTION_API_KEY do app deve ser igual a AUTHENTICATION_API_KEY daqui.
# Nenhuma porta é publicada no servidor: só o proxy do Coolify alcança a Evolution.
services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      # URL pública desta Evolution (ex.: https://wa.sistemadental.com.br)
      SERVER_URL: ${SERVER_URL:?defina SERVER_URL}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?defina AUTHENTICATION_API_KEY}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # O app registra o webhook por instância ao conectar.
      WEBHOOK_GLOBAL_ENABLED: "false"

      CONFIG_SESSION_PHONE_CLIENT: ${CONFIG_SESSION_PHONE_CLIENT:-Sistema Dental}
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
